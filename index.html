<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelo-Família</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 800px; margin: 0 auto; }
        .card { padding: 20px; border: 1px solid #ccc; border-radius: 8px; background: #f9f9f9; }
        button { padding: 10px 20px; margin-top: 10px; cursor: pointer; background: #2196F3; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0b7dda; }
        .alerta { background: #f44336; }
        .alerta:hover { background: #da190b; }
    </style>
</head>
<body>

    <h1>Painel Zelo-Família</h1>
    
    <div class="grid">
        <div class="card">
            <h3>1. Aba Idosos</h3>
            <button id="btn-cadastrar-idoso" onclick="alert('Modal de cadastro aberto')">Cadastrar Idoso</button>
            <button id="btn-listar-idosos" onclick="alert('Lista carregada')">Ver Lista</button>
        </div>

        <div class="card">
            <h3>2. Aba Medicamentos</h3>
            <input type="text" id="input-dosagem" placeholder="Digite a dosagem (ml)" />
            <button id="btn-salvar-med" onclick="alert('Salvo!')">Salvar Medicamento</button>
        </div>

        <div class="card">
            <h3>3. Aba Tarefas</h3>
            <button id="btn-concluir-tarefa" onclick="alert('Tarefa concluída')">✔ Marcar Concluída</button>
            <button id="btn-excluir-tarefa" class="alerta" onclick="alert('Erro 403: Sem permissão')">Excluir Tarefa</button>
        </div>

        <div class="card">
            <h3>4. Aba Emergência</h3>
            <button id="btn-sos" class="alerta" onclick="alert('SOS ENVIADO!')">🚨 Acionar SOS</button>
            <button id="btn-gerar-relatorio" onclick="alert('Relatório baixado')">Gerar Relatório</button>
        </div>
    </div>

</body>
</html>
